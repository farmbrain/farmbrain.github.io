  <g><rect class="t1-fill" x="28" y="70" width="40" height="40" rx="9"/><polyline points="43,82 35,90 43,98" style="fill:none;stroke:var(--t1-soft);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><polyline points="53,82 61,90 53,98" style="fill:none;stroke:var(--t1-soft);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/></g>
