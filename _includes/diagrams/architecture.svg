  <text class="t-body" x="80" y="112">Programming model</text>
  <text class="t-small" x="262" y="60" text-anchor="end" style="font-size:12.5px;font-weight:700;letter-spacing:0.05em;fill:var(--t1)">THRUST 1</text>
  <line class="t1-line" x1="143.0" y1="134" x2="143.0" y2="166" marker-end="url(#dg-ar-a1)"/>
  
  <rect class="t2-box" x="12" y="170" width="262" height="92" rx="12"/>
  <g><rect class="t2-fill" x="28" y="200" width="40" height="40" rx="9"/><circle cx="48" cy="220" r="10.5" style="fill:none;stroke:var(--t2-soft);stroke-width:5;stroke-dasharray:4.12 4.12"/><circle cx="48" cy="220" r="8" style="fill:var(--t2-soft)"/><circle class="t2-fill" cx="48" cy="220" r="3.2"/></g>
