    <line class="ic-thin" x1="202.3" y1="68.4" x2="233.7" y2="68.4"/>
    <polyline class="ic-thin" points="211.6,48.1 229.3,58.9 202.3,68.4"/>
    <circle class="ic" cx="218" cy="30" r="3.5"/>
    <path class="wave" d="M209.6,23.7 a9.1,9.1 0 0 0 0,12.6"/>
    <path class="wave" d="M226.4,23.7 a9.1,9.1 0 0 1 0,12.6"/>
    <path class="wave" d="M203.3,18.8 a15.399999999999999,15.399999999999999 0 0 0 0,22.4"/>
