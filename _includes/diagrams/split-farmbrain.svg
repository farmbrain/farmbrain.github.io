<svg class="dg" viewBox="0 0 440 300" role="img" aria-labelledby="dg-fb-t">
  <title id="dg-fb-t">FarmBrain: the robot keeps only the reactive loop on a low-power embedded processor; the deliberative loop runs on a 5G edge server shared by many robots. Plans flow down to the robot and sensor data flows up over a farm-wide private 5G network.</title>
  <defs><marker id="dg-fb-a2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="t2-fill"/></marker><marker id="dg-fb-a3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="t3-fill"/></marker><marker id="dg-fb-af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fg-fill"/></marker></defs>
  <rect class="t1-box" x="10" y="100" width="170" height="98" rx="10"/>
  <text class="t-strong" x="24" y="126">Embedded processor</text>
  <rect class="t2-box" x="20" y="140" width="150" height="48" rx="24"/>
  <path class="t2-line" d="M56,164 A10,10 0 1 1 46,154" marker-end="url(#dg-fb-a2)"/>
  <text class="t-strong" x="66" y="160">Reactive loop</text>
  <text class="t-small" x="66" y="178">100–1000 Hz</text>
  <g>
