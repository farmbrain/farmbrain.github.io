# Local preview: `docker compose up`, then open http://localhost:4000
# Edits rebuild automatically and the browser reloads itself.
services:
  site:
    image: ruby:3.2
    working_dir: /site
    command: >
      bash -c "bundle install &&
               bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"
    ports:
      - "${PORT:-4000}:4000"   # site; PORT=4002 docker compose up if 4000 is taken
      - "35729:35729"   # live reload
    volumes:
      - .:/site
      - bundle:/usr/local/bundle   # cache gems between runs

volumes:
  bundle:
